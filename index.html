<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif; margin:0; background:#f5f6f8; color:#222; }

  .bar input { flex:1; min-width:240px; padding:11px 14px; font-size:15px; border:1px solid #c9d2dc; border-radius:8px; outline:none; }
  .bar input:focus { border-color:#1f4e79; box-shadow:0 0 0 2px rgba(31,78,121,.15); }
  .bar select { padding:11px 10px; font-size:14px; border:1px solid #c9d2dc; border-radius:8px; background:#fff; }
  .bar .count { font-size:13px; color:#666; white-space:nowrap; }
  .bar button { padding:10px 16px; font-size:14px; border:1px solid #c9d2dc; background:#fff; border-radius:8px; cursor:pointer; }

  .tag-t { color:#fff; background:#c0392b; }      /* 特邀报告 红 */
  .tag-s { color:#fff; background:#279e57; }      /* 学生报告 绿 */
  .tag-o { color:#555; background:#e6e9ee; }      /* 普通报告 */
  mark { background:#fff2a8; padding:0 1px; border-radius:3px; }
  .subj { color:#1f4e79; font-weight:600; }
  .meta { color:#888; font-size:12px; }
  .empty { text-align:center; color:#999; padding:40px; }
  a { color:#1f4e79; }
  footer { background:#1f4e79; color:#e8eef5; margin-top:30px; }
  .foot-bottom { text-align:center; font-size:12px; color:#aec6dd; padding:11px 16px 15px; }
  .who { display:flex; gap:26px; align-items:flex-start; flex-wrap:wrap; margin-top:14px; padding-top:13px; border-top:1px solid rgba(255,255,255,.22); }
  .who-info h3 { margin:0 0 6px; font-size:14px; color:#fff; border-left:3px solid #7fb2e0; padding-left:9px; }
  .who-info p { margin:3px 0; font-size:13px; line-height:1.7; }
  .who-info a { color:#bcd9f2; }
  .who-qr { margin-left:auto; text-align:center; }
  .who-qr img { width:104px; height:104px; border-radius:8px; background:#fff; display:block; margin:0 auto; }
  .who-qr p { margin:5px 0 0; font-size:12px; color:#cfe0f0; }
  /* 状态条与分页 */
  .status { font-size:13px; color:#556; background:#eef2f7; border:1px solid #dde5ee; border-radius:8px; padding:10px 14px; margin-bottom:14px; display:flex; align-items:center; gap:10px; }
  .status .spin { width:13px; height:13px; border:2px solid #b9c6d4; border-top-color:#1f4e79; border-radius:50%; animation:sp .8s linear infinite; flex:0 0 auto; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .status.err { color:#8a2b20; background:#fdf0ee; border-color:#f0cdc7; display:block; }
  .status.err button { margin-top:9px; padding:7px 14px; font-size:13px; border:1px solid #d9b3ac; background:#fff; border-radius:7px; cursor:pointer; }
  .more-wrap { text-align:center; margin-top:14px; }
  .more-wrap button { padding:11px 22px; font-size:14px; border:1px solid #c9d2dc; background:#fff; border-radius:8px; cursor:pointer; }

<body>
<header>
  <h1>2026年中国地球科学联合学术年会（CGU-2026）· 报告查询</h1>
  <p>杭州国际博览中心 · 10月18日–21日分会场专题报告 · 输入报告人姓名 / 报告题目 / 专题名即可检索</p>
  <div class="who">
    <div class="who-info">
      <h3>作者</h3>
      <p><b>彭桢燃</b>（Zhenran Peng）· 中国地质大学（武汉）</p>
      <p>邮箱：<a href="mailto:zhenran.peng@cug.edu.cn">zhenran.peng@cug.edu.cn</a></p>
      <p>课题组：地球重力与人类生活（TVGG）</p>
    </div>
    <div class="who-qr">
      <img src="qrcode.jpg" width="104" height="104" alt="课题组公众号二维码" decoding="async">
      <p>课题组公众号</p>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="bar">
    <input id="q" type="text" placeholder="输入报告人姓名、报告题目或专题名…" autofocus>
    <select id="type">
      <option value="">全部类型</option>
      <option value="特邀报告">特邀报告</option>
      <option value="学生报告">学生报告</option>
      <option value="普通报告">普通报告</option>
    </select>
    <span class="count" id="count"></span>
    <button id="reset" type="button">清空</button>
  </div>
  <div class="status" id="status"><span class="spin"></span><span id="status-text">正在载入报告数据…</span></div>
  <noscript><div class="status err">本页需要浏览器启用 JavaScript 才能检索。</div></noscript>
  <table>
    <thead>
      <tr>
        <th style="width:90px">专题</th>
        <th>报告题目</th>
        <th style="width:120px">报告人</th>
        <th style="width:78px">日期</th>
        <th style="width:120px">时间</th>
        <th style="width:200px">会议地点</th>
        <th style="width:84px">类型</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">未找到匹配的报告</div>
  <div class="more-wrap"><button id="more" type="button" style="display:none">显示更多</button></div>
</div>
<footer>
  <div class="foot-bottom">数据来源：2026年中国地球科学联合学术年会官网（CGU）· 版权归 CGU 所有 · 数据截止 2026.10.5</div>
</footer>

<!-- 数据以 <script> 方式加载：defer 不阻塞首屏，且 file:// 直接打开本地文件也能用 -->
<script src="cgu_data.js" defer></script>
<script>
(function () {
  'use strict';
  var PAGE = 100;                       // 每批渲染行数：首屏只画 100 行，其余点「显示更多」
  var state = { all: [], view: [], shown: 0, raw: '' };

  var qEl = document.getElementById('q');
  var typeEl = document.getElementById('type');
  var rowsEl = document.getElementById('rows');
  var emptyEl = document.getElementById('empty');
  var countEl = document.getElementById('count');
  var statusEl = document.getElementById('status');
  var statusTextEl = document.getElementById('status-text');
  var moreEl = document.getElementById('more');

  function norm(s) { return (s || '').replace(/[\s\u3000]/g, ''); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function hl(text, kw) {
    if (!kw) return text;
    try {
      return text.replace(new RegExp('(' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>');
    } catch (e) { return text; }
  }

  /* 把紧凑数据展开成记录，并预先算好检索串与排序键：
     这样每次输入只需一次 indexOf 扫描，不再逐条做正则归一化 + 重新排序。 */
  function build(D) {
    var subs = D.subjects, dates = D.dates, types = D.types, mods = D.mods;
    var all = new Array(D.reports.length);
    for (var i = 0; i < D.reports.length; i++) {
      var r = D.reports[i];
      var s = subs[r[0]] || ['', '', ''];
      var rec = {
        no: s[0], subject_title: s[1], location: s[2],
        date: dates[r[1]] || '', type: types[r[2]] || '', moderator: mods[r[3]] || '',
        time: r[4], title: r[5], speaker: r[6]
      };
      rec.hay = norm(rec.speaker) + norm(rec.title) + norm(rec.subject_title) + norm('第' + rec.no + '专题');
      all[i] = rec;
    }
    all.sort(function (a, b) { return (a.date + a.time).localeCompare(b.date + b.time); });
    return all;
  }

  function rowHtml(r, raw) {
    var isT = r.type === '特邀报告', isS = r.type === '学生报告';
    var tagCls = isT ? 'tag-t' : (isS ? 'tag-s' : 'tag-o');
    var sym = isT ? '*' : (isS ? '◎' : '');
    return '<tr>' +
      '<td><span class="subj">' + hl(esc('第' + r.no + '专题'), raw) + '</span><div class="meta">' + hl(esc(r.subject_title), raw) + '</div></td>' +
      '<td>' + hl(esc(r.title), raw) + '</td>' +
      '<td>' + hl(esc(r.speaker), raw) + '</td>' +
      '<td>' + hl(esc(r.date), raw) + '</td>' +
      '<td>' + hl(esc(r.time), raw) + '</td>' +
      '<td>' + hl(esc(r.location), raw) + '</td>' +
      '<td><span class="tag ' + tagCls + '">' + sym + esc(r.type.replace('报告', '')) + '</span></td>' +
      '</tr>';
  }

  function append() {
    var out = state.view;
    var end = Math.min(state.shown + PAGE, out.length);
    var html = '';
    for (var i = state.shown; i < end; i++) html += rowHtml(out[i], state.raw);
    if (html) rowsEl.insertAdjacentHTML('beforeend', html);
    state.shown = end;
    var left = out.length - end;
    moreEl.style.display = left > 0 ? 'inline-block' : 'none';
    if (left > 0) moreEl.textContent = '显示更多（还有 ' + left + ' 条）';
  }

  function render() {
    var raw = qEl.value.trim();
    var kw = norm(raw);
    var tp = typeEl.value;
    var out = [], all = state.all;
    for (var i = 0; i < all.length; i++) {
      var r = all[i];
      if (tp && r.type !== tp) continue;
      if (kw && r.hay.indexOf(kw) < 0) continue;
      out.push(r);
    }
    state.view = out; state.raw = raw; state.shown = 0;
    rowsEl.innerHTML = '';
    countEl.textContent = '共 ' + out.length + ' 条' + (kw ? '（匹配“' + raw + '”）' : '');
    emptyEl.style.display = out.length ? 'none' : 'block';
    append();
    syncUrl(raw, tp);
    window.scrollTo(0, 0);
  }

  /* 检索条件写进地址栏，方便分享具体查询（file:// 下失败也不影响使用） */
  function syncUrl(q, tp) {
    try {
      var u = new URL(location.href);
      if (q) u.searchParams.set('q', q); else u.searchParams.delete('q');
      if (tp) u.searchParams.set('type', tp); else u.searchParams.delete('type');
      history.replaceState(null, '', u.href);
    } catch (e) { /* ignore */ }
  }

  function fail() {
    if (timer) clearInterval(timer);
    statusEl.className = 'status err';
    statusEl.innerHTML = '<b>报告数据（cgu_data.js）没有加载成功。</b><br>通常是网络中断导致，请检查网络后重试；也可以直接用浏览器打开仓库里的 index.html 离线查看。' +
      '<br><button id="retry" type="button">重新载入</button>';
    var btn = document.getElementById('retry');
    if (btn) btn.addEventListener('click', function () { location.reload(); });
  }

  function init() {
    if (timer) clearInterval(timer);
    var D = window.CGU_DATA;
    if (!D || !D.reports || !D.reports.length) { fail(); return; }
    try { state.all = build(D); } catch (e) { fail(); return; }

    var params = new URLSearchParams(location.search);
    var q = params.get('q') || '', tp = params.get('type') || '';
    if (q) qEl.value = q;
    if (tp) typeEl.value = tp;
    if (typeEl.value !== tp) typeEl.value = '';

    statusEl.style.display = 'none';
    render();

    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('sw.js').catch(function () { /* 离线缓存不可用时忽略 */ });
    }
  }

  var t0 = Date.now();
  var timer = setInterval(function () {
    if (window.CGU_DATA) { clearInterval(timer); return; }
    statusTextEl.textContent = '正在载入报告数据…已等待 ' + Math.round((Date.now() - t0) / 1000) + ' 秒（约 150 KB，首次访问较慢，之后会走缓存）';
  }, 1000);

  var debounce = null;
  qEl.addEventListener('input', function () {
    if (debounce) clearTimeout(debounce);
    debounce = setTimeout(render, 180);
  });
  typeEl.addEventListener('change', render);
  moreEl.addEventListener('click', append);
  document.getElementById('reset').addEventListener('click', function () {
    qEl.value = ''; typeEl.value = ''; render(); qEl.focus();
  });

  // cgu_data.js 是 defer 脚本，DOMContentLoaded 一定在其之后触发
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
