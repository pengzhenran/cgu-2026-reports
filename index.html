const qEl = document.getElementById('q');
const typeEl = document.getElementById('type');
const rowsEl = document.getElementById('rows');
const emptyEl = document.getElementById('empty');
const countEl = document.getElementById('count');

function hl(text, kw){
  if(!kw) return text;
  try{
    const re = new RegExp('('+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    return text.replace(re, '<mark>$1</mark>');
  }catch(e){ return text; }
}
function norm(s){ return (s||'').replace(/[\s\u3000]/g,''); }

function render(){
  const raw = qEl.value.trim();
  const kw = norm(raw);
  const tp = typeEl.value;
  const out = [];
  for(const r of DATA){
    if(tp && r.type !== tp) continue;
    if(kw){
      const hay = norm(r.speaker) + norm(r.title) + norm(r.subject_title) + norm('第'+r.subject_no+'专题');
      if(!hay.includes(kw)) continue;
    }
    out.push(r);
  }
  out.sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  rowsEl.innerHTML = out.map(r=>{
    const tagCls = r.type==='特邀报告'?'tag-t':(r.type==='学生报告'?'tag-s':'tag-o');
    const sym = r.type==='特邀报告'?'*':(r.type==='学生报告'?'◎':'');
    return `<tr>
      <td><span class="subj">${hl('第'+r.subject_no+'专题', raw)}</span><div class="meta">${hl(r.subject_title, raw)}</div></td>
      <td>${hl(r.title, raw)}</td>
      <td>${hl(r.speaker, raw)}</td>
      <td>${hl(r.date, raw)}</td>
      <td>${hl(r.time, raw)}</td>
      <td>${hl(r.location, raw)}</td>
      <td><span class="tag ${tagCls}">${sym}${r.type.replace('报告','')}</span></td>
    </tr>`;
  }).join('');
  emptyEl.style.display = out.length? 'none':'block';
  countEl.textContent = '共 '+out.length+' 条' + (kw? '（匹配“'+raw+'”）':'');
}
function reset(){ qEl.value=''; typeEl.value=''; render(); qEl.focus(); }
qEl.addEventListener('input', render);
typeEl.addEventListener('change', render);
render();
</script>
